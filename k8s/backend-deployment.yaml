
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fittrack-backend
  namespace: default
  labels:
    app: fittrack-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fittrack-backend
  template:
    metadata:
      labels:
        app: fittrack-backend
    spec:
      containers:
        - name: backend
          image: darminivarshitha/fittrack-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: fittrack-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fittrack-secrets
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: default
spec:
  selector:
    app: fittrack-backend
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
