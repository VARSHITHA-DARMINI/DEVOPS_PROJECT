
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fittrack-frontend
  namespace: default
  labels:
    app: fittrack-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fittrack-frontend
  template:
    metadata:
      labels:
        app: fittrack-frontend
    spec:
      containers:
        - name: frontend
          image: darminivarshitha/fittrack-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: default
spec:
  selector:
    app: fittrack-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
  type: NodePort
