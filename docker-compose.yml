version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: fittrack-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: fittrack
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - fittrack-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fittrack-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/fittrack
      JWT_SECRET: ${JWT_SECRET:-fittrack_docker_secret_change_in_prod}
      JWT_EXPIRE: 7d
      NODE_ENV: production
      FRONTEND_URL: http://localhost
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    networks:
      - fittrack-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fittrack-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - fittrack-network

volumes:
  mongo_data:

networks:
  fittrack-network:
    driver: bridge
